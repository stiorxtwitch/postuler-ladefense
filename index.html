<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Recrutement – La Défense</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(180deg, #020617, #020617);
  color: #e5e7eb;
  margin: 0;
  padding: 40px;
}

.container {
  max-width: 760px;
  margin: auto;
  background: #020617;
  border: 1px solid #1e293b;
  padding: 35px;
  border-radius: 14px;
  box-shadow: 0 0 50px rgba(0,0,0,.7);
}

h1 {
  text-align: center;
  color: #60a5fa;
  margin-bottom: 25px;
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 6px;
  border: 1px solid #1e293b;
  background: #020617;
  color: white;
  font-size: 15px;
}

textarea {
  min-height: 120px;
}

label {
  display: block;
  margin-top: 14px;
}

button {
  margin-top: 28px;
  width: 100%;
  padding: 14px;
  background: #2563eb;
  color: white;
  border: none;
  font-size: 16px;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

#loading {
  display: none;
  text-align: center;
  margin-top: 140px;
}

.spinner {
  width: 70px;
  height: 70px;
  border: 7px solid #1e293b;
  border-top: 7px solid #3b82f6;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="container" id="formContainer">
  <h1>Formulaire de Recrutement</h1>

  <form id="recruitForm">

    <input name="nom" placeholder="Nom & Prénom" required>
    <input type="number" name="age" placeholder="Âge" required>
    <input name="nationalite" placeholder="Nationalité" required>
    <input name="telephone" placeholder="Numéro de téléphone" required>

    <label>Antécédents judiciaires</label>
    <select name="casier" id="casier" required>
      <option value="Non">Non</option>
      <option value="Oui">Oui</option>
    </select>

    <textarea
      name="casier_details"
      id="casier_details"
      placeholder="Précisez vos antécédents judiciaires"
      style="display:none;"
    ></textarea>

    <input name="discord" placeholder="Identifiant Discord" required>
    <input name="dispos" placeholder="Disponibilités (jours)" required>

    <textarea name="motivation" minlength="200"
      placeholder="Pourquoi rejoindre l'armée (5 lignes minimum)" required></textarea>

    <textarea name="apport" placeholder="Que pensez-vous apporter à l'armée ?" required></textarea>
    <textarea name="role" placeholder="Que représente le rôle d’un militaire ?" required></textarea>
    <textarea name="experience" placeholder="Expérience professionnelle" required></textarea>

    <label>
      <input type="checkbox" name="hierarchie" required>
      Je m'engage à respecter la hiérarchie militaire
    </label>

    <label>
      <input type="checkbox" name="sanction" required>
      Je comprends que toute faute peut entraîner une sanction
    </label>

    <label>
      <input type="checkbox" name="honnete" required>
      J’ai répondu honnêtement au questionnaire
    </label>

    <button type="submit">Envoyer le dossier</button>
  </form>
</div>

<div id="loading">
  <div class="spinner"></div>
  <p>Dossier en attente de validation…</p>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzm0Wbf7bCLY_YHoMDT0tBfjTK9YjfrFJiVpL6ngXMsk_gvJVL2fnd79JD-C3rWmu69/exec";

// Champ conditionnel casier
document.getElementById("casier").addEventListener("change", e => {
  document.getElementById("casier_details").style.display =
    e.target.value === "Oui" ? "block" : "none";
});

// Récupération IP
async function getIP() {
  const r = await fetch("https://api.ipify.org?format=json");
  const d = await r.json();
  return d.ip;
}

// INITIALISATION AU CHARGEMENT
async function init() {
  const ip = localStorage.getItem("recruit_ip");
  if (!ip) return;

  const res = await fetch(SCRIPT_URL + "?ip=" + ip);
  const status = await res.text();

  if (status === "VALIDÉ") {
    window.location.href = "https://stiorxtwitch.github.io/psychological-test-ladefense/";
  }
  else if (status === "EN_ATTENTE") {
    document.getElementById("formContainer").style.display = "none";
    document.getElementById("loading").style.display = "block";
    setInterval(checkStatus, 5000);
  }
  else {
    // Aucun dossier trouvé → reset
    localStorage.removeItem("recruit_ip");
  }
}

// ENVOI FORMULAIRE
document.getElementById("recruitForm").addEventListener("submit", async e => {
  e.preventDefault();

  const ip = await getIP();
  const formData = new FormData(e.target);
  formData.append("ip", ip);

  await fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: formData
  });

  localStorage.setItem("recruit_ip", ip);

  document.getElementById("formContainer").style.display = "none";
  document.getElementById("loading").style.display = "block";
  setInterval(checkStatus, 5000);
});

// Vérification statut
async function checkStatus() {
  const ip = localStorage.getItem("recruit_ip");
  if (!ip) return;

  const res = await fetch(SCRIPT_URL + "?ip=" + ip);
  const status = await res.text();

  if (status === "VALIDÉ") {
    window.location.href = "https://stiorxtwitch.github.io/psychological-test-ladefense/";
  }
}

init();
</script>

</body>
</html>
