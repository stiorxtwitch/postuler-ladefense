<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Recrutement – La Défense</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 20px;
}

form {
  max-width: 700px;
  margin: auto;
  background: #020617;
  padding: 25px;
  border-radius: 10px;
}

h2 {
  text-align: center;
}

input, textarea, select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 5px;
  border: none;
}

textarea {
  min-height: 100px;
}

label {
  display: block;
  margin-top: 10px;
}

button {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  background: #2563eb;
  color: white;
  border: none;
  font-size: 16px;
  cursor: pointer;
  border-radius: 5px;
}

#loading {
  display: none;
  text-align: center;
  margin-top: 100px;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 6px solid #1e293b;
  border-top: 6px solid #3b82f6;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<form id="recruitForm">
<h2>Formulaire de Recrutement – La Défense</h2>

<input name="nom" placeholder="Nom Prénom" required>
<input type="number" name="age" placeholder="Âge" required>
<input name="nationalite" placeholder="Nationalité" required>
<input name="telephone" placeholder="Numéro de téléphone" required>

<select name="casier">
  <option value="Non">Aucun antécédent judiciaire</option>
  <option value="Oui">Oui (préciser)</option>
</select>

<input name="discord" placeholder="Identifiant Discord" required>
<input name="dispos" placeholder="Disponibilités (jours)" required>

<textarea name="motivation" minlength="200" placeholder="Pourquoi rejoindre l'armée (5 lignes minimum)" required></textarea>
<textarea name="apport" placeholder="Que pensez-vous apporter à l'armée ?" required></textarea>
<textarea name="role" placeholder="Que représente le rôle d’un militaire ?" required></textarea>
<textarea name="experience" placeholder="Expérience professionnelle (si oui)" required></textarea>

<label><input type="checkbox" name="hierarchie" required> Je m'engage à respecter la hiérarchie militaire</label>
<label><input type="checkbox" name="sanction" required> Je comprends les sanctions possibles</label>
<label><input type="checkbox" name="honnete" required> J’ai répondu honnêtement</label>

<button type="submit">Envoyer le dossier</button>
</form>

<div id="loading">
  <div class="spinner"></div>
  <p>Dossier en attente de validation...</p>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzm0Wbf7bCLY_YHoMDT0tBfjTK9YjfrFJiVpL6ngXMsk_gvJVL2fnd79JD-C3rWmu69/exec";

async function getIP() {
  const r = await fetch("https://api.ipify.org?format=json");
  const d = await r.json();
  return d.ip;
}

document.getElementById("recruitForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const ip = await getIP();
  const formData = new FormData(e.target);
  formData.append("ip", ip);

  await fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: formData
  });

  localStorage.setItem("recruit_ip", ip);
  showLoading();
});

function showLoading() {
  document.getElementById("recruitForm").style.display = "none";
  document.getElementById("loading").style.display = "block";
  setInterval(checkStatus, 5000);
}

async function checkStatus() {
  const ip = localStorage.getItem("recruit_ip");
  if (!ip) return;

  const res = await fetch(SCRIPT_URL + "?ip=" + ip);
  const txt = await res.text();

  if (txt === "VALIDÉ") {
    window.location.href = "https://stiorxtwitch.github.io/psychological-test-ladefense/";
  }
}

checkStatus();
</script>

</body>
</html>
