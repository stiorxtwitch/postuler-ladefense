<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Recrutement – La Défense</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #020617;
  color: #e5e7eb;
  margin: 0;
  padding: 40px;
}

.container {
  max-width: 760px;
  margin: auto;
  background: #020617;
  border: 1px solid #1e293b;
  padding: 35px;
  border-radius: 14px;
}

h1 {
  text-align: center;
  color: #60a5fa;
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 6px;
  border: 1px solid #1e293b;
  background: #020617;
  color: white;
}

textarea { min-height: 120px; }

label { display:block; margin-top:12px; }

button {
  margin-top: 25px;
  width: 100%;
  padding: 14px;
  background: #2563eb;
  border: none;
  color: white;
  font-size: 16px;
  border-radius: 6px;
  cursor: pointer;
}

#loading {
  display: none;
  text-align: center;
  margin-top: 120px;
}

.spinner {
  width: 70px;
  height: 70px;
  border: 7px solid #1e293b;
  border-top: 7px solid #3b82f6;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: auto;
}

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<body>

<div class="container" id="formContainer">
  <h1>Formulaire de Recrutement</h1>

  <form id="recruitForm">
    <input name="nom" placeholder="Nom & Prénom" required>
    <input type="number" name="age" placeholder="Âge" required>
    <input name="nationalite" placeholder="Nationalité" required>
    <input name="telephone" placeholder="Numéro de téléphone" required>

    <label>Antécédents judiciaires</label>
    <select name="casier" id="casier">
      <option value="Non">Non</option>
      <option value="Oui">Oui</option>
    </select>

    <textarea id="casier_details" name="casier_details"
      placeholder="Précisez vos antécédents"
      style="display:none;"></textarea>

    <input name="discord" placeholder="Identifiant Discord" required>
    <input name="dispos" placeholder="Disponibilités" required>

    <textarea name="motivation" minlength="200"
      placeholder="Pourquoi rejoindre l'armée ?" required></textarea>

    <textarea name="apport" placeholder="Ce que vous apportez" required></textarea>
    <textarea name="role" placeholder="Rôle du militaire" required></textarea>
    <textarea name="experience" placeholder="Expérience" required></textarea>

    <label><input type="checkbox" required> Respect de la hiérarchie</label>
    <label><input type="checkbox" required> Compréhension des sanctions</label>
    <label><input type="checkbox" required> Honnêteté</label>

    <button type="submit">Envoyer</button>
  </form>
</div>

<div id="loading">
  <div class="spinner"></div>
  <p>Dossier en attente de validation…</p>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzm0Wbf7bCLY_YHoMDT0tBfjTK9YjfrFJiVpL6ngXMsk_gvJVL2fnd79JD-C3rWmu69/exec";
let statusInterval = null;

// Champ conditionnel
document.getElementById("casier").addEventListener("change", e => {
  casier_details.style.display = e.target.value === "Oui" ? "block" : "none";
});

// IP
async function getIP() {
  const r = await fetch("https://api.ipify.org?format=json");
  return (await r.json()).ip;
}

// INIT — ne fait RIEN sans IP valide
async function init() {
  const ip = localStorage.getItem("recruit_ip");
  if (!ip) return;

  const res = await fetch(SCRIPT_URL + "?ip=" + ip);
  const status = await res.text();

  if (status === "EN_ATTENTE") {
    showLoading();
  } else if (status === "VALIDÉ") {
    window.location.href = "https://stiorxtwitch.github.io/psychological-test-ladefense/";
  } else {
    localStorage.removeItem("recruit_ip");
  }
}

// SUBMIT — seul endroit où le loading est autorisé
document.getElementById("recruitForm").addEventListener("submit", async e => {
  e.preventDefault();

  const ip = await getIP();
  const data = new FormData(e.target);
  data.append("ip", ip);

  await fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: data
  });

  localStorage.setItem("recruit_ip", ip);
  showLoading();
});

function showLoading() {
  document.getElementById("formContainer").style.display = "none";
  document.getElementById("loading").style.display = "block";

  if (!statusInterval) {
    statusInterval = setInterval(checkStatus, 5000);
  }
}

async function checkStatus() {
  const ip = localStorage.getItem("recruit_ip");
  if (!ip) return;

  const res = await fetch(SCRIPT_URL + "?ip=" + ip);
  if ((await res.text()) === "VALIDÉ") {
    window.location.href = "https://stiorxtwitch.github.io/psychological-test-ladefense/";
  }
}

init();
</script>

</body>
</html>
